plugins {
    id "net.neoforged.moddev" version "2.0.140"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

group = project.property("mod_group_id")
version = project.property("mod_version")

neoForge {
    version = project.property("neo_version")

    mods {
        craftpro {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def expandProps = [
        "mod_id"      : project.property("mod_id"),
        "mod_name"    : project.property("mod_name"),
        "mod_version" : project.property("mod_version"),
        "mod_authors" : project.property("mod_authors"),
        "mod_group_id": project.property("mod_group_id"),
        "version"     : project.version,
    ]
    inputs.properties(expandProps)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(expandProps)
    }
}

jar {
    manifest {
        attributes([
            "FMLModType": "MOD"
        ])
    }
}
